services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmuser}
      POSTGRES_DB: ${POSTGRES_DB:-mattermost}
      TZ: ${TZ:-UTC}
    volumes:
      # Named volume: bind mounts on /mnt/c/ (WSL→Windows) break PostgreSQL permissions.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmuser} -d ${POSTGRES_DB:-mattermost}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mattermost:
    image: mattermost/mattermost-team-edition:${MATTERMOST_IMAGE_TAG:-10.5.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MATTERMOST_PORT:-8065}:8065"
    environment:
      TZ: ${TZ:-UTC}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${POSTGRES_USER:-mmuser}:${POSTGRES_PASSWORD:-mmuser}@db:5432/${POSTGRES_DB:-mattermost}?sslmode=disable&connect_timeout=10
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
      MM_SERVICESETTINGS_SITEURL: ${MM_SERVICESETTINGS_SITEURL:-http://localhost:8065}
      # Plugin development (mattermost-transcribe bundle is ~63 MB)
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_FILESETTINGS_MAXFILESIZE: "104857600"
      # Easier local debugging
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
    volumes:
      - mm_config:/mattermost/config
      - mm_data:/mattermost/data
      - mm_logs:/mattermost/logs
      - mm_plugins:/mattermost/plugins
      - mm_client_plugins:/mattermost/client/plugins
      - mm_bleve:/mattermost/bleve-indexes

volumes:
  pgdata:
  mm_config:
  mm_data:
  mm_logs:
  mm_plugins:
  mm_client_plugins:
  mm_bleve:
