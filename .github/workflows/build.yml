name: Build

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Run tests
        run: make test-ci

  build:
    name: Build plugin bundle
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build distribution bundle
        run: make dist

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v7
        with:
          name: plugin-bundle
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download plugin bundle
        uses: actions/download-artifact@v7
        with:
          name: plugin-bundle
          path: dist

      - name: Prepare release metadata
        id: meta
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE=false
            PREV_TAG=$(git tag --sort=-v:refname --list 'v*' | grep -Fxv "$TAG" | head -1 || true)
          else
            VERSION=$(jq -r .version plugin.json)
            SHA=$(git rev-parse --short HEAD)
            TAG="v${VERSION}-${SHA}"
            PRERELEASE=true
            PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          {
            echo "changelog<<EOF"
            echo "## Changes"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)' --reverse
            else
              git log -30 --pretty=format:'- %s (%h)' --reverse
            fi
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: ${{ steps.meta.outputs.changelog }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/*.tar.gz
          generate_release_notes: false
