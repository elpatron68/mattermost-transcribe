# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # parser and plugin must upgrade together (see closed PR #8)
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      # client, types, and redux share peer dependencies (see closed PR #15)
      mattermost:
        patterns:
          - "@mattermost/*"
          - "mattermost-redux"
      # keep @babel/* on the same minor line (patch/minor only; see closed PR #18)
      babel:
        patterns:
          - "@babel/*"
    ignore:
      # webpack-cli v6+ breaks the current webpack 5 toolchain (see PR #3)
      - dependency-name: webpack-cli
        update-types: [version-update:semver-major]
      # Babel 8 blocked by @emotion/babel-preset-css-prop (^7 only; see closed PR #18)
      - dependency-name: "@babel/*"
        update-types: [version-update:semver-major]
      # TS 4→6 needs a coordinated migration; npm --package-lock-only hangs on major bumps
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
