# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # webpack-cli v6+ breaks the current webpack 5 toolchain (see PR #3)
      - dependency-name: webpack-cli
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /mattermost-server-dev
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /docs/parakeet-qa
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
